name: ${COMPOSE_NAME}



# Definimos los servicios que se ejecutarán en los contenedores Docker.
services:
  java:
    image: ${PROJECT_NAME}:${VERSION:-SNAPSHOT}
    ports:
      - "${PUERTO_DESARROLLO:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/desarrollodb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_PROFILES_ACTIVE: desarrollo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 5s
    restart: always
    expose: 
      - "8080"
    volumes:
      - proyecto4_files:/uploads


  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: 'desarrollodb'
      POSTGRES_USER: 'admin'
      POSTGRES_PASSWORD: 'admin'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d desarrollodb" ]
      timeout: 20s
      retries: 10
    restart: always
    ports:
      - "${PUERTO_DB_DESARROLLO}:5432"
    volumes:
      - proyecto4_data:/var/lib/postgresql/data
      - ./cargadatos/datos.sql:/docker-entrypoint-initdb.d/datos.sql


volumes:
  proyecto4_data:

  proyecto4_files:
