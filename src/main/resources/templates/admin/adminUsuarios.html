<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/plantilla}"
      lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administrar Usuarios</title>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .table-actions button {
            margin-right: 5px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div layout:fragment="contenido">
        <div class="container py-5">
            <div class="card shadow rounded">
                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 text-white">Gestión de Usuarios</h4>
                </div>
                <div class="card-body p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>Nickname</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="usuario : ${usuariosPage.content}">
                                <td th:text="${usuario.nickname}">user1</td>
                                <td th:text="${usuario.email}">email@example.com</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${usuario.rol}">USER</span>
                                </td>
                                <td class="text-end table-actions">
<!--                                    <form th:action="@{/admin/usuarios/desactivar/{id}(id=${usuario.id})}" method="post" class="d-inline">-->
<!--                                        <button class="btn btn-warning btn-sm" title="Desactivar">-->
<!--                                            <i class="bi bi-slash-circle"></i>-->
<!--                                        </button>-->
<!--                                    </form>-->
                                    <form th:action="@{/admin/usuarios/editar/{id}(id=${usuario.id})}" method="get" class="d-inline">
                                        <button class="btn btn-info btn-sm" title="Editar">
                                            <i class="bi bi-pencil-square"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/usuarios/eliminar/{id}(id=${usuario.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Estás seguro de que quieres eliminar este usuario?');">
                                        <button class="btn btn-danger btn-sm" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${usuariosPage.content.size() == 0}">
                                <td colspan="4" class="text-center text-muted">No hay usuarios disponibles.</td>
                            </tr>
                            </tbody>
                        </table>

                        <nav>
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${usuariosPage.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/usuarios(page=${currentPage - 1})}">Anterior</a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, usuariosPage.totalPages - 1)}"
                                    th:classappend="${i == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/usuarios(page=${i})}" th:text="${i + 1}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${usuariosPage.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/usuarios(page=${currentPage + 1})}">Siguiente</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
