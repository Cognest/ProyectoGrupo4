<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/plantilla}">
<head>
    <title>Búsqueda</title>
    <style>
        .search-container {
            background: #f7f7f7;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }
        .filter-bar {
            background: #fff;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 30px;
        }
        .filter-item {
            margin-right: 20px;
            color: #555;
            cursor: pointer;
            font-size: 14px;
        }
        .filter-item:hover {
            color: #5fcf80;
        }
        .filter-item.active {
            color: #5fcf80;
            font-weight: 500;
        }
        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0) 100%);
            padding: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .grid-item:hover .image-overlay {
            opacity: 1;
        }

        .image-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .btn-download {
            width: 100%;
            background: #228b18;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            transition: background-color 0.3s;
        }

        .btn-download:hover {
            background: #357abd;
        }

        /* Estilos para la paginación */
        .pagination .page-link {
            color: #2e8b57;  /* Verde mar oscuro para el texto */
            border-color: #98fb98;  /* Verde menta claro para los bordes */
        }

        .pagination .page-link:hover {
            background-color: #98fb98;  /* Verde menta claro al pasar el mouse */
            border-color: #3cb371;  /* Verde medio mar para el borde al hover */
            color: #008100;  /* Verde oscuro para el texto al hover */
        }

        .pagination .page-item.active .page-link {
            background-color: #2e8b57;  /* Verde mar oscuro para el botón activo */
            border-color: #2e8b57;
            color: white;  /* Texto blanco en el botón activo */
        }

        .pagination .page-item.disabled .page-link {
            color: #90ee90;  /* Verde claro para elementos deshabilitados */
            border-color: #98fb98;
        }
    </style>

    <style>
        /* ... (mantener otros estilos existentes) ... */

        .grid-item {
            position: relative;
            aspect-ratio: 3/4;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
        }

        .stats-container {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .grid-item:hover .stats-container {
            opacity: 1;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(4px);
        }

        .stat-item i {
            font-size: 14px;
        }

        .download-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(74, 158, 255, 0.9);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease, background-color 0.2s;
        }

        .grid-item:hover .download-btn {
            opacity: 1;
        }

        .download-btn:hover {
            background: rgba(34, 139, 34, 1);
        }
    </style>

    <style>
        /* ... (mantener los otros estilos existentes) ... */

        /* Eliminar los estilos anteriores de masonry-grid */
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columnas de igual tamaño */
            gap: 20px;
            margin-bottom: 30px;
        }

        .grid-item {
            aspect-ratio: 3/4; /* Mantiene una proporción consistente */
            width: 100%;
            margin-bottom: 0; /* Eliminamos el margin-bottom anterior */
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Asegura que la imagen cubra todo el espacio sin distorsionarse */
            border-radius: 8px;
        }

        /* Ajustamos el responsive para mantener siempre 3 columnas */
        @media (max-width: 768px) {
            .masonry-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .masonry-grid {
                grid-template-columns: 1fr;
            }
        }

        .contenido-wrapper {
            display: none;
        }

        .contenido-wrapper.show {
            display: block;
        }
    </style>
</head>

<body>
<div layout:fragment="contenido">
    <form th:action="@{/busqueda/{tipo}(tipo = ${tipo})}" method="get" id="filtro-form">
        <div class="search-container">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <input type="text"
                               class="form-control form-control-lg"
                               placeholder="Buscar imágenes, modelos, vídeos y música"
                               name="buscador"
                               id="buscador"
                               th:value="${busqueda}">
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-bar">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center">
                    <div class="col-md-3">
                        <label for="fecha" class="form-label small">Fecha de subida</label>
                        <select id="fecha" name="fecha" class="form-select form-select-sm">
                            <option value="" th:selected="${fecha == null}">Cualquier fecha</option>
                            <option value="hoy" th:selected="${fecha == 'hoy'}">Hoy</option>
                            <option value="semana" th:selected="${fecha == 'semana'}">Esta semana</option>
                            <option value="mes" th:selected="${fecha == 'mes'}">Este mes</option>
                        </select>
                    </div>
                    <div class="ms-auto">
                        <label for="orden" class="form-label small">Ordenar por</label>
                        <select id="orden" name="orden" class="form-select form-select-sm">
                            <option value="likes" th:selected="${orden == 'likes'}">Más populares</option>
                            <option value="recientes" th:selected="${orden == 'recientes'}">Más recientes</option>
                            <option value="vistos" th:selected="${orden == 'vistos'}">Más vistos</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </form>


    <!-- Contenido principal -->
    <div class="container">
        <!-- Barra de filtros -->
        <div class="filter-bar">
            <div class="container">
                <div id="subtipoFilterContainer" class="d-flex flex-wrap align-items-center">
                    <div class="filter-item active" data-subtipo="all">Todo</div>
                    <div class="filter-item"
                         th:each="subtipo : ${subtipos}"
                         th:attr="data-subtipo=${subtipo.toLowerCase().replace(' ', '-')}"
                         th:text="${subtipo}">
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${contenidos.isEmpty()}">
            <p>No se han encontrado resultados para esa búsqueda.</p>
        </div>
        <div class="masonry">
            <div th:each="contenido, iterStat : ${contenidos}"
                 class="contenido-wrapper"
                 th:classappend="' subtipo-' + ${contenido.subtipo?.toLowerCase()?.replace(' ', '-')}"
                 data-aos="fade-up"
                 th:attr="data-aos-delay=${iterStat.index * 100}">
                <div class="masonry-item hover-container" th:switch="${contenido.formato}">

                    <!-- IMAGEN -->
                    <div th:case="'imagenes'" th:style="'--bg:url(' + ${contenido.url} + ')'">
                        <a th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                            <img th:src="${contenido.url}" class="image select" alt="Contenido"/>
                            <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua">
                            <div class="overlay">
                                <div class="overlay-actions">
                                    <!-- LIKE -->
                                    <button class="action-btn like-btn" th:attr="data-id=${contenido.id}">
                                        <i th:class="${likesIds.contains(contenido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                    </button>

                                    <!-- GUARDAR -->
                                    <button class="action-btn guardar-btn" th:attr="data-id=${contenido.id}">
                                        <i th:class="${guardadosIds.contains(contenido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                                    </button>
                                </div>
                                <div class="overlay-title" th:text="${contenido.titulo}"></div>
                            </div>
                        </a>
                        <div class="overlay-user-wrapper">
                            <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${contenido.nicknameCreador}}">
                                <img th:src="${contenido.avatarCreador}" class="user-avatar" alt="Avatar"/>
                                <span class="user-name" th:text="${'@' + contenido.nicknameCreador}"></span>
                            </a>
                        </div>
                    </div>

                    <!-- VIDEO -->
                    <div th:case="'videos'" class="preview-item hover-container"
                         th:attr="data-type='video',
              data-src=${contenido.url},
              data-id=${contenido.id},
              data-title=${contenido.titulo},
              data-user=${'@' + contenido.nicknameCreador},
              data-avatar=${contenido.avatarCreador},
              data-nickname=${contenido.nicknameCreador}">

                        <!-- Enlace al contenido -->
                        <a class="video-link" th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                            <!-- Imagen de preview (poster generado por JS) -->
                            <img class="image preview-img" alt="Preview"/>

                            <!-- Marca de agua -->
                            <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua"/>

                            <!-- Video (oculto por defecto) -->
                            <video class="image hover-video" muted playsinline loop preload="metadata">
                                <source th:src="${contenido.url}" type="video/mp4" />
                            </video>

                            <!-- Botón de play -->
                            <span class="play-button"><i class="fa fa-play"></i></span>

                            <!-- Overlay de info -->
                            <div class="overlay">
                                <div class="overlay-actions">
                                    <!-- LIKE -->
                                    <button class="action-btn like-btn" th:attr="data-id=${contenido.id}">
                                        <i th:class="${likesIds.contains(contenido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                    </button>

                                    <!-- GUARDAR -->
                                    <button class="action-btn guardar-btn" th:attr="data-id=${contenido.id}">
                                        <i th:class="${guardadosIds.contains(contenido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                                    </button>
                                </div>
                                <div class="overlay-title" th:text="${contenido.titulo}"></div>
                            </div>
                        </a>
                        <div class="overlay-user-wrapper">
                            <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${contenido.nicknameCreador}}">
                                <img th:src="${contenido.avatarCreador}" class="user-avatar" alt="Avatar"/>
                                <span class="user-name" th:text="${'@' + contenido.nicknameCreador}"></span>
                            </a>
                        </div>
                    </div>

                    <!-- AUDIO -->
                    <div th:case="'audios'">
                        <div class="music-player">
                            <div class="cover">
                                <a th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                                    <img th:src="${contenido.urlPortada}" alt="Portada"/>
                                </a>
                            </div>
                            <div class="titre">
                                <a th:href="@{'/usuario/' + ${contenido.nicknameCreador}}">
                                    <h3 th:text="${contenido.nicknameCreador}"></h3>
                                </a>
                                <a th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                                    <h1 th:text="${contenido.titulo}"></h1>
                                </a>
                            </div>
                            <audio th:src="${contenido.url}" preload="metadata"></audio>

                            <div class="controls">
                                <button class="play-pause play btn-play" aria-label="Play/Pause"></button>
                                <div class="volume-container">
                                    <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1" />
                                    <button class="volume-toggle" aria-label="Mute/Unmute">
                                        <i class="fa fa-volume-up"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="progress-container">
                                <div class="progress"></div>
                            </div>
                            <div class="time">
                                <span class="current-time">0:00</span>
                                <span class="duration">0:00</span>
                            </div>
                            <div class="actions-aud">
                                <!-- LIKE -->
                                <button class="action-btn like-btn" th:attr="data-id=${contenido.id}">
                                    <i th:class="${likesIds.contains(contenido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                </button>

                                <!-- GUARDAR -->
                                <button class="action-btn guardar-btn" th:attr="data-id=${contenido.id}">
                                    <i th:class="${guardadosIds.contains(contenido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- MODELO 3D -->
                    <div th:case="'modelos3d'">
                        <a th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                            <img th:src="${contenido.urlPortada}" class="image" alt="Portada"/>
                            <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua">
                            <div class="overlay">
                                <div class="overlay-actions">
                                    <!-- LIKE -->
                                    <button class="action-btn like-btn" th:attr="data-id=${contenido.id}">
                                        <i th:class="${likesIds.contains(contenido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                    </button>

                                    <!-- GUARDAR -->
                                    <button class="action-btn guardar-btn" th:attr="data-id=${contenido.id}">
                                        <i th:class="${guardadosIds.contains(contenido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                                    </button>
                                </div>
                                <div class="overlay-title" th:text="${contenido.titulo}"></div>
                            </div>
                        </a>
                        <div class="overlay-user-wrapper">
                            <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${contenido.nicknameCreador}}">
                                <img th:src="${contenido.avatarCreador}" class="user-avatar" alt="Avatar"/>
                                <span class="user-name" th:text="${'@' + contenido.nicknameCreador}"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('filtro-form');

            document.getElementById('fecha').addEventListener('change', function () {
                form.submit();
            });

            document.getElementById('orden').addEventListener('change', function () {
                form.submit();
            });
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const subtipoButtons = document.querySelectorAll('#subtipoFilterContainer .filter-item');
            const contenidos = document.querySelectorAll('.contenido-wrapper');

            subtipoButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const selected = button.getAttribute('data-subtipo');

                    // Activar visualmente
                    subtipoButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    // Mostrar u ocultar elementos según el filtro
                    contenidos.forEach(item => {
                        if (selected === 'all' || item.classList.contains('subtipo-' + selected)) {
                            item.classList.add('show');
                        } else {
                            item.classList.remove('show');
                        }
                    });
                });
            });

            // Mostrar todos por defecto al cargar
            contenidos.forEach(item => item.classList.add('show'));
        });
    </script>
</div>

</body>
</html>
