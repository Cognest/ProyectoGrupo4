<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/plantilla}">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/main.css">
    <title>Actividad</title>
</head>
<body class="bg-gradient-primary">

<!-- Aqui vamos a escribir el contenido de los bloques  -->
<div layout:fragment="contenido" >
    <!--<h1>Configuración de Cuenta</h1> -->
    <div class="configuracion-cuenta-container row">
        <h1>Tu Actividad</h1>
        <!-- Menú lateral -->
        <div class="menu-lateral col-4">
            <div class="foto-perfil-container">
                <img th:src="@{/assets/img/foto-perfil.png}" alt="Foto de perfil" class="foto-perfil">
            </div>
            <nav class="menu-opciones">
                <button class="menu-btn" id="btn-meGusta">Me Gusta</button>
                <button class="menu-btn" id="btn-guardados">Guardados</button>
                <button class="menu-btn" id="btn-contenidoPropio">Contenido Propio</button>
                <button class="menu-btn" id="btn-contenidoAdquirido">Contenido Adquirido</button>
                <button class="menu-btn" id="btn-historial">Historial</button>
                <button class="menu-btn" id="btn-comentarios">Comentarios</button>
            </nav>
        </div>
        <!-- Contenido principal -->
        <div class="col-8">
            <div class="fondo-rectangulo-verde p-4">
                <!-- Me Gusta -->
                <section id="contenido-megusta" class="contenido-principal">
                    <p> Publicaciones que te han gustado </p>
                </section>

                <!-- Guardados -->
                <section id="contenido-guardados" class="contenido-principal" style="display:none;">
                    <p> Publicaciones que has Guardado </p>
                </section>

                <!-- Contenido propio -->
                <section id="contenido-contenidoProp" class="contenido-principal" style="display:none;">
                    <p> Contenido que has compartido </p>
                </section>

                <!-- Contenido adquirido -->
                <section id="contenido-contenidoAd" class="contenido-principal" style="display:none;">
                    <p> Contenidos que has Adquirido </p>
                </section>

                <!-- Historial -->
                <section id="contenido-historial" class="contenido-principal" style="display:none;">
                    <p> Tu historial de visualizaciones </p>
                </section>

                <!-- Comentarios -->
                <section id="contenido-comentarios" class="contenido-principal" style="display:none;">
                    <p> Comentarios realizados </p>
                </section>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const botones = [
                { btn: 'btn-meGusta', contenido: 'contenido-megusta' },
                { btn: 'btn-guardados', contenido: 'contenido-guardados' },
                { btn: 'btn-contenidoPropio', contenido: 'contenido-contenidoProp' },
                { btn: 'btn-contenidoAdquirido', contenido: 'contenido-contenidoAd' },
                { btn: 'btn-historial', contenido: 'contenido-historial' },
                { btn: 'btn-comentarios', contenido: 'contenido-comentarios' }
            ];

            botones.forEach(({btn, contenido}) => {
                document.getElementById(btn).addEventListener('click', function() {
                    // Oculta todos los contenidos
                    botones.forEach(({contenido}) => {
                        document.getElementById(contenido).style.display = 'none';
                    });
                    // Muestra el contenido seleccionado
                    document.getElementById(contenido).style.display = 'block';

                    // Actualiza el botón activo
                    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('activo'));
                    this.classList.add('activo');
                });
            });
            document.getElementById('btn-meGusta').click();
        });
    </script>
</div>
</body>
</html>
