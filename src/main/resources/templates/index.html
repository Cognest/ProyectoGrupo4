<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/plantilla}">
<head>
  <title>home</title>
  <!-- Importa Bootstrap Icons si aún no lo tienes -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


</head>

<body class="bg-gradient-primary">

<div layout:fragment="contenido">

  <!-- Busqueda Section -->
  <section id="busqueda" class="busqueda features section">
    <div class="container">
      <div th:if="${param.compraExitosa}" class="alert alert-success mt-3">
        ✅ ¡Compra realizada con éxito! Puedes ver tus contenidos en tu perfil.
      </div>
      <div th:if="${param.accesoDenegado}" class="alert alert-danger mt-3">
        <strong>Acceso denegado.</strong> No tienes permisos para entrar a esta sección.
      </div>
      <div class="row gy-4">
        <div class="col-xl-3 col-lg-6 col-md-6" data-aos="fade-up" data-aos-delay="100">
          <div class="features-item">
            <i class="bi bi-camera" style="color: #ffbb2c;"></i>
            <h3><a th:href="@{/busqueda/imagenes}" class="stretched-link">Imágenes</a></h3>
          </div>
        </div>
        <div class="col-xl-3 col-lg-6 col-md-6" data-aos="fade-up" data-aos-delay="200">
          <div class="features-item">
            <i class="bi bi-camera-video" style="color: #5578ff;"></i>
            <h3><a th:href="@{/busqueda/videos}" class="stretched-link">Videos</a></h3>
          </div>
        </div>
        <div class="col-xl-3 col-lg-6 col-md-6" data-aos="fade-up" data-aos-delay="300">
          <div class="features-item">
            <i class="bi bi-music-note-beamed" style="color: #e80368;"></i>
            <h3><a th:href="@{/busqueda/audios}" class="stretched-link">Audios</a></h3>
          </div>
        </div>
        <div class="col-xl-3 col-lg-6 col-md-6" data-aos="fade-up" data-aos-delay="500">
          <div class="features-item">
            <i class="bi bi-box" style="color: #47aeff;"></i>
            <h3><a th:href="@{/busqueda/modelos3d}" class="stretched-link">Modelos 3D</a></h3>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <form th:action="@{/busqueda}" method="get" class="buscador-form" data-aos="fade-up" data-aos-delay="200">
        <div class="row gy-4">
          <div class="col-12">
            <input type="search" id="buscador" name="buscador" class="form-control" placeholder="Buscador" required>
          </div>
        </div>
      </form>
    </div>
  </section><!-- /Busqueda Section -->

  <!-- Courses Section -->
  <section id="courses" class="courses section">

    <!-- Section Title -->
    <div class="container section-title" data-aos="fade-up">
      <h2>Contenido</h2>
      <p>Contenido Popular</p>
    </div><!-- End Section Title -->

    <div class="container">
      <div class="masonry">
        <div th:each="contenido, iterStat : ${contenidos}" data-aos="fade-up" th:attr="data-aos-delay=${iterStat.index * 100}">
          <div class="masonry-item hover-container" th:switch="${contenido.formato}">

            <!-- IMAGEN -->
            <div th:case="'imagenes'" th:style="'--bg:url(' + ${contenido.url} + ')'">
              <a th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                <img th:src="${contenido.url}" class="image select" alt="Contenido"/>
                <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua">
                <div class="overlay">
                  <div class="overlay-actions">
                    <!-- LIKE -->
                    <button class="action-btn like-btn" th:attr="data-id=${contenido.id}">
                      <i th:class="${likesIds.contains(contenido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                    </button>

                    <!-- GUARDAR -->
                    <button class="action-btn guardar-btn" th:attr="data-id=${contenido.id}">
                      <i th:class="${guardadosIds.contains(contenido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                    </button>
                  </div>
                  <div class="overlay-title" th:text="${contenido.titulo}"></div>
                </div>
              </a>
              <div class="overlay-user-wrapper">
                <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${contenido.nicknameCreador}}">
                  <img th:src="${contenido.avatarCreador}" class="user-avatar" alt="Avatar"/>
                  <span class="user-name" th:text="${'@' + contenido.nicknameCreador}"></span>
                </a>
              </div>
            </div>

            <!-- VIDEO -->
            <div th:case="'videos'" class="filterDiv select-vid preview-item hover-container"
                 th:attr="data-type='video',
              data-src=${contenido.url},
              data-id=${contenido.id},
              data-title=${contenido.titulo},
              data-user=${'@' + contenido.nicknameCreador},
              data-avatar=${contenido.avatarCreador},
              data-nickname=${contenido.nicknameCreador}">

              <!-- Enlace al contenido -->
              <a class="video-link" th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                <!-- Imagen de preview (poster generado por JS) -->
                <img class="image preview-img" alt="Preview"/>

                <!-- Marca de agua -->
                <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua"/>

                <!-- Video (oculto por defecto) -->
                <video class="image hover-video" muted playsinline loop preload="metadata">
                  <source th:src="${contenido.url}" type="video/mp4" />
                </video>

                <!-- Botón de play -->
                <span class="play-button"><i class="fa fa-play"></i></span>

                <!-- Overlay de info -->
                <div class="overlay">
                  <div class="overlay-actions">
                    <!-- LIKE -->
                    <button class="action-btn like-btn" th:attr="data-id=${contenido.id}">
                      <i th:class="${likesIds.contains(contenido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                    </button>

                    <!-- GUARDAR -->
                    <button class="action-btn guardar-btn" th:attr="data-id=${contenido.id}">
                      <i th:class="${guardadosIds.contains(contenido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                    </button>
                  </div>
                  <div class="overlay-title" th:text="${contenido.titulo}"></div>
                </div>
              </a>
              <div class="overlay-user-wrapper">
                <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${contenido.nicknameCreador}}">
                  <img th:src="${contenido.avatarCreador}" class="user-avatar" alt="Avatar"/>
                  <span class="user-name" th:text="${'@' + contenido.nicknameCreador}"></span>
                </a>
              </div>
            </div>

            <!-- AUDIO -->
            <div th:case="'audios'" class="filterDiv select-aud">
              <div class="music-player">
                <div class="cover">
                  <a th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                    <img th:src="${contenido.urlPortada}" alt="Portada"/>
                  </a>
                </div>
                <div class="titre">
                  <a th:href="@{'/usuario/' + ${contenido.nicknameCreador}}">
                    <h3 th:text="${contenido.nicknameCreador}"></h3>
                  </a>
                  <a th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                    <h1 th:text="${contenido.titulo}"></h1>
                  </a>
                </div>
                <audio th:src="${contenido.url}" preload="metadata"></audio>

                <div class="controls">
                  <button class="play-pause play btn-play" aria-label="Play/Pause"></button>
                  <div class="volume-container">
                    <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1" />
                    <button class="volume-toggle" aria-label="Mute/Unmute">
                      <i class="fa fa-volume-up"></i>
                    </button>
                  </div>
                </div>
                <div class="progress-container">
                  <div class="progress"></div>
                </div>
                <div class="time">
                  <span class="current-time">0:00</span>
                  <span class="duration">0:00</span>
                </div>
                <div class="actions-aud">
                  <!-- LIKE -->
                  <button class="action-btn like-btn" th:attr="data-id=${contenido.id}">
                    <i th:class="${likesIds.contains(contenido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                  </button>

                  <!-- GUARDAR -->
                  <button class="action-btn guardar-btn" th:attr="data-id=${contenido.id}">
                    <i th:class="${guardadosIds.contains(contenido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- MODELO 3D -->

            <div th:case="'modelos3d'">
              <a th:href="@{'/contenido/' + ${contenido.nicknameCreador} + '/' + ${contenido.id}}">
                <img th:src="${contenido.urlPortada}" class="image" alt="Portada"/>
                <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua">
                <div class="overlay">
                  <div class="overlay-actions">
                    <!-- LIKE -->
                    <button class="action-btn like-btn" th:attr="data-id=${contenido.id}">
                      <i th:class="${likesIds.contains(contenido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                    </button>

                    <!-- GUARDAR -->
                    <button class="action-btn guardar-btn" th:attr="data-id=${contenido.id}">
                      <i th:class="${guardadosIds.contains(contenido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                    </button>
                  </div>
                  <div class="overlay-title" th:text="${contenido.titulo}"></div>
                </div>
              </a>
              <div class="overlay-user-wrapper">
                <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${contenido.nicknameCreador}}">
                  <img th:src="${contenido.avatarCreador}" class="user-avatar" alt="Avatar"/>
                  <span class="user-name" th:text="${'@' + contenido.nicknameCreador}"></span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section><!-- /Courses Section -->
</div>
</body>
</html>
