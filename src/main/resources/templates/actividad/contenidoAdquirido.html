<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/plantilla}">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/main.css">
    <title>Contenido adquirido</title>
    <style>
        .btn-chat-tabs {
            display: block;
        }

        @media (min-width: 992px) {
            .btn-chat-tabs {
                display: flex;
            }
        }
    </style>
</head>
<body class="bg-gradient-primary">

<!-- Aqui vamos a escribir el contenido de los bloques  -->
<div layout:fragment="contenido" >
    <!-- Page Title -->
    <div class="page-title mb-3" data-aos="fade">
        <nav class="breadcrumbs">
            <div class="container">
                <ol>
                    <li><a th:href="@{/}">Inicio</a></li>
                    <li class="current">Contenidos Adquiridos</li>
                </ol>
            </div>
        </nav>
    </div><!-- End Page Title -->
    <div class="container px-4">
        <div class="row">
            <!-- Menú lateral -->
            <div class="menu-lateral col-md-3">
                <div class="foto-perfil-container">
                    <a th:href="@{/usuario/{nickname}(nickname = ${usuario.nickname})}">
                        <img th:src="${usuario.avatar}" alt="Foto de perfil" class="foto-perfil">
                    </a>
                </div>
                <nav class="menu-opciones">
                    <a th:href="@{/actividad/guardados}" class="nav-link-guardados menu-btn-actividad">Guardados</a>
                    <a th:href="@{/actividad/contenidos-adquiridos}" class="nav-link-guardados menu-btn-actividad activo">Contenido Adquirido</a>
                    <a th:href="@{/actividad/comentarios}" class="nav-link-guardados menu-btn-actividad">Comentarios</a>
                </nav>
            </div>
            <!-- Contenido principal -->
            <div class="col-md-9">
                <div class="fondo-rectangulo-verde p-4">
                    <!-- Contenido adquirido -->
                    <section id="contenido-contenidoAd" class="contenido-principal">
                        <div class="topbar">CONTENIDO ADQUIRIDO</div>

                        <div id="myBtnContainerAdquirido" class="btn-chat-tabs justify-content-center gap-3 mt-3 mb-3 px-2">
                            <button class="btn custom-tab-nav mx-0 mb-1 w-100 active" data-filter="all">TODO</button>
                            <button class="btn custom-tab-nav mx-0 mb-1 w-100" data-filter="select-img">IMAGENES</button>
                            <button class="btn custom-tab-nav mx-0 mb-1 w-100" data-filter="select-vid">VIDEOS</button>
                            <button class="btn custom-tab-nav mx-0 mb-1 w-100" data-filter="select-aud">AUDIO</button>
                            <button class="btn custom-tab-nav mx-0 mb-1 w-100" data-filter="select-tres-d">3D</button>
                        </div>

                        <div class="masonry-guardados">
                            <div th:each="adquirido, iterStat : ${adquiridos}"
                                 class="contenido-wrapper-adquiridos"
                                 th:classappend="' ' + ${adquirido.claseFiltro}"
                                 data-aos="fade-up"
                                 th:attr="data-aos-delay=${iterStat.index * 100}">
                                <div class="masonry-item hover-container" th:switch="${adquirido.formato}">

                                    <!-- IMAGEN -->
                                    <div th:case="'imagenes'" th:style="'--bg:url(' + ${adquirido.url} + ')'">
                                        <a th:href="@{'/contenido/' + ${adquirido.nicknameCreador} + '/' + ${adquirido.id}}">
                                            <img th:src="${adquirido.url}" class="image select" alt="Contenido"/>
                                            <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua">
                                            <div class="overlay">
                                                <div class="overlay-actions">
                                                    <!-- LIKE -->
                                                    <button class="action-btn like-btn" th:attr="data-id=${adquirido.id}">
                                                        <i th:class="${likesIds.contains(adquirido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                                    </button>

                                                    <!-- GUARDAR -->
                                                    <button class="action-btn guardar-btn" th:attr="data-id=${adquirido.id}">
                                                        <i th:class="${guardadosIds.contains(adquirido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                                                    </button>
                                                </div>
                                                <div class="overlay-title" th:text="${adquirido.titulo}"></div>
                                            </div>
                                        </a>
                                        <div class="overlay-user-wrapper">
                                            <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${adquirido.nicknameCreador}}">
                                                <img th:src="${adquirido.avatarCreador}" class="user-avatar" alt="Avatar"/>
                                                <span class="user-name" th:text="${'@' + adquirido.nicknameCreador}"></span>
                                            </a>
                                        </div>
                                    </div>

                                    <!-- VIDEO -->
                                    <div th:case="'videos'" class="preview-item hover-container"
                                         th:attr="data-type='video',
                                              data-src=${adquirido.url},
                                              data-id=${adquirido.id},
                                              data-title=${adquirido.titulo},
                                              data-user=${'@' + adquirido.nicknameCreador},
                                              data-avatar=${adquirido.avatarCreador},
                                              data-nickname=${adquirido.nicknameCreador}">

                                        <!-- Enlace al contenido -->
                                        <a class="video-link" th:href="@{'/contenido/' + ${adquirido.nicknameCreador} + '/' + ${adquirido.id}}">
                                            <!-- Imagen de preview (poster generado por JS) -->
                                            <img class="image preview-img" alt="Preview"/>

                                            <!-- Marca de agua -->
                                            <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua"/>

                                            <!-- Video (oculto por defecto) -->
                                            <video class="image hover-video" muted playsinline loop preload="metadata">
                                                <source th:src="${adquirido.url}" type="video/mp4" />
                                            </video>

                                            <!-- Botón de play -->
                                            <span class="play-button"><i class="fa fa-play"></i></span>

                                            <!-- Overlay de info -->
                                            <div class="overlay">
                                                <div class="overlay-actions">
                                                    <!-- LIKE -->
                                                    <button class="action-btn like-btn" th:attr="data-id=${adquirido.id}">
                                                        <i th:class="${likesIds.contains(adquirido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                                    </button>

                                                    <!-- GUARDAR -->
                                                    <button class="action-btn guardar-btn" th:attr="data-id=${adquirido.id}">
                                                        <i th:class="${guardadosIds.contains(adquirido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                                                    </button>
                                                </div>
                                                <div class="overlay-title" th:text="${adquirido.titulo}"></div>
                                            </div>
                                        </a>
                                        <div class="overlay-user-wrapper">
                                            <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${adquirido.nicknameCreador}}">
                                                <img th:src="${adquirido.avatarCreador}" class="user-avatar" alt="Avatar"/>
                                                <span class="user-name" th:text="${'@' + adquirido.nicknameCreador}"></span>
                                            </a>
                                        </div>
                                    </div>

                                    <!-- AUDIO -->
                                    <div th:case="'audios'">
                                        <div class="music-player">
                                            <div class="cover">
                                                <a th:href="@{'/contenido/' + ${adquirido.nicknameCreador} + '/' + ${adquirido.id}}">
                                                    <img th:src="${adquirido.urlPortada}" alt="Portada"/>
                                                </a>
                                            </div>
                                            <div class="titre">
                                                <a th:href="@{'/usuario/' + ${adquirido.nicknameCreador}}">
                                                    <h3 th:text="${adquirido.nicknameCreador}"></h3>
                                                </a>
                                                <a th:href="@{'/contenido/' + ${adquirido.nicknameCreador} + '/' + ${adquirido.id}}">
                                                    <h1 th:text="${adquirido.titulo}"></h1>
                                                </a>
                                            </div>
                                            <audio th:src="${adquirido.url}" preload="metadata"></audio>

                                            <div class="controls">
                                                <button class="play-pause play btn-play" aria-label="Play/Pause"></button>
                                                <div class="volume-container">
                                                    <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1" />
                                                    <button class="volume-toggle" aria-label="Mute/Unmute">
                                                        <i class="fa fa-volume-up"></i>
                                                    </button>
                                                </div>
                                            </div>
                                            <div class="progress-container">
                                                <div class="progress"></div>
                                            </div>
                                            <div class="time">
                                                <span class="current-time">0:00</span>
                                                <span class="duration">0:00</span>
                                            </div>
                                            <div class="actions-aud">
                                                <!-- LIKE -->
                                                <button class="action-btn like-btn" th:attr="data-id=${adquirido.id}">
                                                    <i th:class="${likesIds.contains(adquirido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                                </button>

                                                <!-- GUARDAR -->
                                                <button class="action-btn guardar-btn" th:attr="data-id=${adquirido.id}">
                                                    <i th:class="${guardadosIds.contains(adquirido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- MODELO 3D -->
                                    <div th:case="'modelos3d'">
                                        <a th:href="@{'/contenido/' + ${adquirido.nicknameCreador} + '/' + ${adquirido.id}}">
                                            <img th:src="${adquirido.urlPortada}" class="image" alt="Portada"/>
                                            <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua">
                                            <div class="overlay">
                                                <div class="overlay-actions">
                                                    <!-- LIKE -->
                                                    <button class="action-btn like-btn" th:attr="data-id=${adquirido.id}">
                                                        <i th:class="${likesIds.contains(adquirido.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                                    </button>

                                                    <!-- GUARDAR -->
                                                    <button class="action-btn guardar-btn" th:attr="data-id=${adquirido.id}">
                                                        <i th:class="${guardadosIds.contains(adquirido.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                                                    </button>
                                                </div>
                                                <div class="overlay-title" th:text="${adquirido.titulo}"></div>
                                            </div>
                                        </a>
                                        <div class="overlay-user-wrapper">
                                            <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${adquirido.nicknameCreador}}">
                                                <img th:src="${adquirido.avatarCreador}" class="user-avatar" alt="Avatar"/>
                                                <span class="user-name" th:text="${'@' + adquirido.nicknameCreador}"></span>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            function filterSelection(category) {
                const items = document.getElementsByClassName("contenido-wrapper-adquiridos");

                for (let i = 0; i < items.length; i++) {
                    items[i].classList.remove("show");

                    if (category === "all" || items[i].classList.contains(category)) {
                        items[i].classList.add("show");
                        items[i].style.display = "block";
                    } else {
                        items[i].style.display = "none";
                    }
                }
            }


            filterSelection("all");

            const buttons = document.querySelectorAll("#myBtnContainerAdquirido .custom-tab-nav");
            buttons.forEach(button => {
                button.addEventListener("click", function () {
                    const filter = this.getAttribute("data-filter");
                    filterSelection(filter);

                    document.querySelectorAll("#myBtnContainerAdquirido .custom-tab-nav.active")
                        .forEach(b => b.classList.remove("active"));
                    this.classList.add("active");
                });
            });
        });
    </script>
</div>
</body>
</html>
