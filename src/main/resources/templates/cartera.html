<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{/layout/plantilla}">
<title>Interfaz de Guardados</title>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <style>
        .scrollable-history {
            max-height: 350px; /* ajusta esta altura según el tamaño de tus ítems */
            overflow-y: auto;
            border: 1px solid #ddd; /* opcional, para que quede delimitado */
            border-radius: 4px;
        }

        .saldo-actual {
            color: var(--accent-color); /* Ejemplo: verde Bootstrap */
            font-weight: bold;
        }

        .btn-saldo {
            background-color: var(--accent-color);
            color: #fff ;
            border: none ;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-saldo:hover {
            background-color: color-mix(in srgb, var(--accent-color), transparent 20%);
            color: #fff ;
        }

    </style>
</head>

<body>
<div layout:fragment="contenido">
    <div class="container">
        <div class="row">
            <!-- Sidebar izquierda -->
            <div class="col-md-3 menu-lateral">
                <div th:unless="${#authorization.expression('isAuthenticated()')}">
                    <div class="foto-perfil-container">
                        <img src="/assets/img/anonimo.png" alt="Foto de perfil" class="foto-perfil">

                        <nav class="menu-opciones">
                            <a th:href="@{/iniciar-sesion}" class="nav-link-guardados">Iniciar sesión</a>
                        </nav>
                    </div>
                </div>
                <div th:if="${#authorization.expression('isAuthenticated()')}">
                    <div class="foto-perfil-container">
                        <a th:href="@{/usuario/{nickname}(nickname = ${usuario.nickname})}">
                            <img th:src="${usuario.avatar}" alt="Foto de perfil" class="foto-perfil">
                        </a>

                        <nav class="menu-opciones">
                            <a th:href="@{/actividad}" class="nav-link-guardados">Tu actividad</a>
                            <a th:href="@{/config-perfil}" class="nav-link-guardados">Configuración</a>
                            <a th:href="@{/conocenos}" class="nav-link-guardados">Conócenos</a>
                            <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/admin/usuarios}" class="nav-link-guardados">Administrar usuarios</a>
                        </nav>
                    </div>
                </div>
            </div>

            <!-- Contenido central -->
            <div class="col-md-9">
                <div class="p-4">
                    <!-- Saldo actual y botones -->
                    <div class="d-flex flex-wrap align-items-center mb-4">
                        <h2 class="mb-0 me-5 saldo-actual">SALDO ACTUAL: <span th:text="${usuario.token + 'Tk'}">0 Tk</span></h2>
                        <div class="d-flex flex-wrap gap-3">
                            <a th:href="@{/planes}"> <button class="btn btn-saldo">Recargar</button> </a>
                            <button class="btn btn-saldo">Retirar</button>
                        </div>
                    </div>

                    <!-- Historial -->
                    <h4 class="mb-3 fw-bold">Historial</h4>
                    <div class="scrollable-history">
                        <div class="list-group" th:each="cartera : ${carteras}">
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <div class="d-flex gap-2" th:switch="${cartera.operacion}">
                                    <span class="small fst-italic text-muted" th:text="${#temporals.format(cartera.fecha, 'dd/MM/yyyy, HH:mm:ss')}">15/07/2025</span>
                                    <span th:case="compra" th:text="${'Realizaste una compra por un total de: -' + cartera.cantidad + 'Tk'}"></span>
                                    <span th:case="venta" th:text="${'Realizaste una venta por un total de: +' + cartera.cantidad + 'Tk'}"></span>
                                    <span th:case="ingreso" th:text="${'Ingresaste un total de: +' + cartera.cantidad + 'Tk'}"></span>
                                    <span th:case="retirada" th:text="${'Retiraste un total de: -' + cartera.cantidad + 'Tk'}"></span>
                                </div>
                                <strong th:text="${'Saldo: ' + cartera.saldoActual + 'Tk'}"></strong>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
