<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/plantilla}">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Avatar</title>
</head>
<body class="bg-gradient-primary">

<!-- Aqui vamos a escribir el contenido de los bloques  -->
<div layout:fragment="contenido" >
    <!-- Page Title -->
    <div class="page-title mb-3" data-aos="fade">
        <nav class="breadcrumbs">
            <div class="container">
                <ol>
                    <li><a th:href="@{/}">Inicio</a></li>
                    <li class="current">Imagen de Perfil</li>
                </ol>
            </div>
        </nav>
    </div><!-- End Page Title -->
    <div class="container px-4">
        <div class="row">
            <!-- Menú lateral -->
            <div class="menu-lateral col-md-3">
                <div class="foto-perfil-container">
                    <a th:href="@{/usuario/{nickname}(nickname = ${usuario.nickname})}">
                        <img th:src="${usuario.avatar}" alt="Foto de perfil" class="foto-perfil">
                    </a>
                </div>
                <nav class="menu-opciones">
                    <a th:href="@{/config-perfil/editar-foto}" class="nav-link-guardados menu-btn-actividad activo">Editar Foto</a>
                    <a th:href="@{/config-perfil/seguridad}" class="nav-link-guardados menu-btn-actividad">Contraseña y Seguridad</a>
                    <a th:href="@{/config-perfil/datos-personales}" class="nav-link-guardados menu-btn-actividad">Datos Personales</a>
                    <a th:href="@{/config-perfil/perfiles-bloqueados}" class="nav-link-guardados menu-btn-actividad">Perfiles Bloqueados</a>
                </nav>
            </div>
            <!-- Contenido principal -->
            <div class="col-md-9">
                <div class="fondo-rectangulo-verde p-4">
                    <!-- Editar Foto -->
                    <section id="contenido-fotoPerfil" class="contenido-principal">
                        <form th:action="@{/usuario/cambiar-avatar}" method="post" enctype="multipart/form-data" class="d-flex flex-column align-items-center gap-3">

                            <!-- Imagen circular con overlay siempre visible -->
                            <div class="position-relative" style="width: 220px; height: 220px;">
                                <img id="avatarPreview" th:src="${usuario.avatar}" alt="Avatar actual"
                                     style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid #ccc;">

                                <!-- Overlay siempre visible con texto pequeño -->
                                <label for="avatar"
                                       class="d-flex justify-content-center align-items-center text-white"
                                       style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                  border-radius: 50%; background-color: rgba(0, 0, 0, 0.4);
                  font-size: 0.8rem; text-align: center; cursor: pointer;">
                                    Cambiar<br>foto de perfil
                                </label>
                            </div>

                            <!-- Input de archivo oculto -->
                            <input type="file" name="avatar" id="avatar" accept="image/*" style="display: none;" onchange="previewAvatar(this)" required>

                            <!-- Botón de enviar -->
                            <button type="submit" class="nav-link-guardados active" style="width: auto; border: none; outline: none;">
                                Guardar
                            </button>
                        </form>
                    </section>
                </div>
            </div>
        </div>
        <script>
            function previewAvatar(input) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        document.getElementById('avatarPreview').src = e.target.result;
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            }
        </script>
    </div>
</div>
</body>
</html>
