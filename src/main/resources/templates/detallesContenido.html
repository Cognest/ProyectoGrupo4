<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/plantilla}">
<head>

  <title>Detalles</title>
</head>

<body class="bg-gradient-primary">

<!-- Aqui vamos a escribir el contenido de los bloques  -->
<div layout:fragment="contenido" >
  <section>
    <div class="container">
      <div class="row">
        <div class="col-lg-8">
          <div th:switch="${contenido.formato}">
            <!--IMAGENES-->
            <div class="media-container" th:case="'imagenes'">
              <img th:src="${contenido.url}" th:alt="${contenido.descripcion}" />
              <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua">
            </div>

            <!--VIDEOS-->
            <div class="media-container" th:case="'videos'">
              <video class="image hover-video w-100" playsinline loop controls preload="metadata">
                <source th:src="${contenido.url}" type="video/mp4" />
              </video>
              <img src="/assets/img/logos/logoBlanco.png" class="watermark" alt="Marca de agua">
            </div>

            <!--AUDIOS-->
            <div class="media-container" th:case="'audios'">
              <div class="music-player rounded" style="width: 380px">
                <div class="cover">
                  <img th:src="${contenido.urlPortada}" alt="Portada"/>
                </div>
                <div class="titre">
                  <h3 th:text="${usuario.nickname}"></h3>
                  <h1 th:text="${contenido.titulo}"></h1>
                </div>
                <audio th:src="${contenido.url}" preload="metadata"></audio>

                <div class="controls">
                  <button class="play-pause play btn-play" aria-label="Play/Pause"></button>
                  <div class="volume-container">
                    <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1" />
                    <button class="volume-toggle" aria-label="Mute/Unmute">
                      <i class="fa fa-volume-up"></i>
                    </button>
                  </div>
                </div>
                <div class="progress-container">
                  <div class="progress"></div>
                </div>
                <div class="time">
                  <span class="current-time">0:00</span>
                  <span class="duration">0:00</span>
                </div>
              </div>
            </div>

            <!--MODELOS 3D-->
            <div th:case="'modelos3d'" class="media-container visor3d-container select-tres-d">
              <img th:src="${contenido.urlPortada}"
                   th:attr="data-model=${contenido.url}"
                   alt="Modelo 3D"
                   class="preview-img"
                   style="width: 100%; height: auto; object-fit: inherit;">
              <div class="visor3d" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:1;"></div>
            </div>
          </div>
          <div class="mb-3 mt-3">

            <div class="d-flex align-items-center mb-2" style="gap: 1rem;">

              <h1 class="mb-0" th:text="${contenido.titulo}"></h1>

              <!-- Solo visible para el creador -->
              <th:block th:if="${relacion == 'Creador'}">
                <div class="ms-auto">
                  <a class="btn btn-outline-success rounded-2 px-3" th:href="@{'/contenido/editar/' + ${contenido.id}}">
                    <i class="bi bi-pencil"></i> Editar
                  </a>

                  <form th:action="@{'/contenido/eliminar/' + ${contenido.id}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('¿Estás seguro de que quieres eliminar este contenido?')">
                      <i class="bi bi-trash"></i> Eliminar
                    </button>
                  </form>
                </div>
              </th:block>

            </div>

            <div class="d-flex gap-1">
              <div th:each="etiqueta : ${etiquetas}">
                <button type="button" class="btn btn-outline-success" th:text="${etiqueta.nombre}"></button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="border rounded p-4 counts">
            <div>
              <div class="d-flex align-items-start align-items-center mb-4">
                <img th:src="${usuario.avatar}" class="avatar me-3 mt-1">
                <h3 class="fw-bold" th:text="${usuario.nickname}">user1_</h3>
              </div>
              <div class="mb-2">
                <span class="h3" th:text="${contenido.precio}"></span><sub>Tk</sub>
              </div>
              <th:block th:if="${relacion == null}">
                <form th:action="@{/carrito/anadir}" method="post">
                  <input type="hidden" th:name="contenidoId" th:value="${contenido.id}" />
                  <button type="submit" class="btn btn-success w-100">
                    <i class="bi bi-cart-plus me-1"></i> Añadir al carrito
                  </button>
                </form>
              </th:block>
              <th:block th:if="${relacion == 'Pendiente'}">
                <div class="alert alert-success mt-3" role="alert">
                  <strong>✅ Añadido al carrito</strong>
                </div>
              </th:block>
              <th:block th:if="${relacion == 'Adquirido' || relacion == 'Creador'}">
                <h2 class="d-flex text-center">
                  <a class="w-100 rounded btn-descargar"
                     th:href="@{'/contenido/' + ${contenido.id} + '/descargar'}"
                     download>
                    Descargar <i class="bi bi-download"></i>
                  </a>
                </h2>
              </th:block>
              <div class="d-flex justify-content-between my-1">
                <h4>Nº de visitas: </h4>
                <span class="h4 fw-bold" th:text="${contenido.visitas}"></span>
              </div>
              <div class="d-flex justify-content-between my-1">
                <h4>Nº de descargas: </h4>
                <span id="contador-descargas" class="h4 fw-bold" th:text="${descargas}"></span>
              </div>

              <div class="d-flex">
                <button id="like-button" class="btn btn-outline-success d-flex me-1" th:attr="data-id=${contenido.id}">
                  <i id="like-icon"
                     th:class="${usuario != null} ? (${haDadoLike} ? 'bi bi-heart-fill' : 'bi bi-heart') : 'bi bi-heart'">
                  </i>
                  <div id="like-count" class="ms-2" th:text="${likes}"></div>
                </button>
                <button id="save-button" class="btn btn-outline-success ms-1" th:attr="data-id=${contenido.id}">
                  <i id="save-icon" th:class="${estaGuardado} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                </button>

                <button class="btn btn-outline-danger ms-2" th:attr="data-id=${contenido.id}" title="Reportar contenido">
                  <i class="bi bi-flag"></i>
                </button>

              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4 p-2 comentarios">
        <h2>Comentarios</h2>
        <div th:if="${#authorization.expression('isAuthenticated()')}" class="card mb-5 p-4 comment-card">
          <form id="comentario-form">
            <input type="hidden" id="contenidoId" th:value="${contenido.id}" />
            <div class="d-flex align-items-start">
              <img th:src="${#authorization.expression('isAuthenticated()') ? usuarioLogueado.avatar : '/assets/img/foto-perfil.png'}" class="avatar me-3 mt-1" alt="Tu Avatar">
              <div class="flex-grow-1">
                <div class="mb-3">
                  <textarea class="form-control" id="comentario" rows="3" placeholder="Escribe tu comentario..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-publicar" disabled>Publicar</button>
              </div>
            </div>
          </form>
        </div>
        <div th:unless="${#authorization.expression('isAuthenticated()')}">
          <div class="alert alert-warning">
            <strong>Inicia sesión</strong> para comentar en esta publicación.
          </div>
        </div>

        <!-- Lista de comentarios -->
        <div th:if="${comentarios.isEmpty()}">
          <p id="no-comments-msg" class="text-muted text-center">* Este post no tiene comentarios todavía *</p>
        </div>
        <div class="listaComentarios">
          <div th:each="comentario : ${comentarios}">
            <div class="comment-card p-3 mb-3 d-flex">
              <img th:src="${comentario.usuario.avatar}" class="avatar me-3" alt="Avatar">
              <div>
                <div>
                  <span class="fw-bold" th:text="${comentario.usuario.nickname}"></span>
                  <small class="text-muted" th:text="${#temporals.format(comentario.fecha, 'dd/MM/yyyy, HH:mm:ss')}"></small>
                </div>
                <p class="mb-0" th:text="${comentario.mensaje}"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Courses Section -->
  <section id="courses" class="courses section" style="padding: 40px 0;">

    <!-- Section Title -->
    <div class="container section-title" data-aos="fade-up">
      <h2>Contenido</h2>
      <p>Contenido Popular</p>
    </div><!-- End Section Title -->

    <div class="container">
      <div class="masonry">
        <div th:each="itemGaleria, iterStat : ${galeria}" data-aos="fade-up" th:attr="data-aos-delay=${iterStat.index * 100}">
          <div class="masonry-item hover-container" th:switch="${itemGaleria.formato}">

            <!-- IMAGEN -->
            <div th:case="'imagenes'" th:style="'--bg:url(' + ${itemGaleria.url} + ')'">
              <a th:href="@{'/contenido/' + ${itemGaleria.nicknameCreador} + '/' + ${itemGaleria.id}}">
                <img th:src="${itemGaleria.url}" class="image" />
                <img src="/assets/img/logos/logoBlanco.png" class="watermark">
                <div class="overlay">
                  <div class="overlay-actions">
                    <!-- LIKE -->
                    <button class="action-btn like-btn" th:attr="data-id=${itemGaleria.id}">
                      <i th:class="${likesIds.contains(itemGaleria.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                    </button>

                    <!-- GUARDAR -->
                    <button class="action-btn guardar-btn" th:attr="data-id=${itemGaleria.id}">
                      <i th:class="${guardadosIds.contains(itemGaleria.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                    </button>


                  </div>
                  <div class="overlay-title" th:text="${itemGaleria.titulo}"></div>
                </div>
              </a>
              <div class="overlay-user-wrapper">
                <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${itemGaleria.nicknameCreador}}">
                  <img th:src="${itemGaleria.avatarCreador}" class="user-avatar" />
                  <span class="user-name" th:text="${'@' + itemGaleria.nicknameCreador}"></span>
                </a>
              </div>
            </div>

            <!-- VIDEO -->
            <div th:case="'videos'" class="filterDiv select-vid preview-item hover-container"
                 th:attr="data-type='video',
              data-src=${itemGaleria.url},
              data-id=${itemGaleria.id},
              data-title=${itemGaleria.titulo},
              data-user=${'@' + itemGaleria.nicknameCreador},
              data-avatar=${itemGaleria.avatarCreador},
              data-nickname=${itemGaleria.nicknameCreador}">

              <!-- Enlace al contenido -->
              <a class="video-link" th:href="@{'/contenido/' + ${itemGaleria.nicknameCreador} + '/' + ${itemGaleria.id}}">
                <!-- Imagen de preview (poster generado por JS) -->
                <img class="image preview-img" alt="Preview" />

                <!-- Marca de agua -->
                <img src="/assets/img/logos/logoBlanco.png" class="watermark" />

                <!-- Video (oculto por defecto) -->
                <video class="image hover-video" muted playsinline loop preload="metadata">
                  <source th:src="${itemGaleria.url}" type="video/mp4" />
                </video>

                <!-- Botón de play -->
                <span class="play-button"><i class="fa fa-play"></i></span>

                <!-- Overlay de info -->
                <div class="overlay">
                  <div class="overlay-actions">
                    <!-- LIKE -->
                    <button class="action-btn like-btn" th:attr="data-id=${itemGaleria.id}">
                      <i th:class="${likesIds.contains(itemGaleria.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                    </button>

                    <!-- GUARDAR -->
                    <button class="action-btn guardar-btn" th:attr="data-id=${itemGaleria.id}">
                      <i th:class="${guardadosIds.contains(itemGaleria.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                    </button>
                  </div>
                  <div class="overlay-title" th:text="${itemGaleria.titulo}"></div>
                </div>
              </a>
              <div class="overlay-user-wrapper">
                <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${itemGaleria.nicknameCreador}}">
                  <img th:src="${itemGaleria.avatarCreador}" class="user-avatar" />
                  <span class="user-name" th:text="${'@' + itemGaleria.nicknameCreador}"></span>
                </a>
              </div>
            </div>

            <!-- AUDIO -->
            <div th:case="'audios'" class="filterDiv select-aud">
              <div class="music-player">
                <div class="cover">
                  <a th:href="@{'/contenido/' + ${itemGaleria.nicknameCreador} + '/' + ${itemGaleria.id}}">
                    <img th:src="${itemGaleria.urlPortada}" alt="Portada"/>
                  </a>
                </div>
                <div class="titre">
                  <a th:href="@{'/usuario/' + ${itemGaleria.nicknameCreador}}">
                    <h3 th:text="${itemGaleria.nicknameCreador}"></h3>
                  </a>
                  <a th:href="@{'/contenido/' + ${itemGaleria.nicknameCreador} + '/' + ${itemGaleria.id}}">
                    <h1 th:text="${itemGaleria.titulo}"></h1>
                  </a>
                </div>
                <audio th:src="${itemGaleria.url}" preload="metadata"></audio>

                <div class="controls">
                  <button class="play-pause play btn-play" aria-label="Play/Pause"></button>
                  <div class="volume-container">
                    <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1" />
                    <button class="volume-toggle" aria-label="Mute/Unmute">
                      <i class="fa fa-volume-up"></i>
                    </button>
                  </div>
                </div>
                <div class="progress-container">
                  <div class="progress"></div>
                </div>
                <div class="time">
                  <span class="current-time">0:00</span>
                  <span class="duration">0:00</span>
                </div>
                <div class="actions-aud">
                  <!-- LIKE -->
                  <button class="action-btn like-btn" th:attr="data-id=${itemGaleria.id}">
                    <i th:class="${likesIds.contains(itemGaleria.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                  </button>

                  <!-- GUARDAR -->
                  <button class="action-btn guardar-btn" th:attr="data-id=${itemGaleria.id}">
                    <i th:class="${guardadosIds.contains(itemGaleria.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- MODELO 3D -->
            <div th:case="'modelos3d'">
              <a th:href="@{'/contenido/' + ${itemGaleria.nicknameCreador} + '/' + ${itemGaleria.id}}">
                <img th:src="${itemGaleria.urlPortada}" class="image" />
                <img src="/assets/img/logos/logoBlanco.png" class="watermark">
                <div class="overlay">
                  <div class="overlay-actions">
                    <!-- LIKE -->
                    <button class="action-btn like-btn" th:attr="data-id=${itemGaleria.id}">
                      <i th:class="${likesIds.contains(itemGaleria.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                    </button>

                    <!-- GUARDAR -->
                    <button class="action-btn guardar-btn" th:attr="data-id=${itemGaleria.id}">
                      <i th:class="${guardadosIds.contains(itemGaleria.id)} ? 'bi bi-bookmark-fill' : 'bi bi-bookmark'"></i>
                    </button>
                  </div>
                  <div class="overlay-title" th:text="${itemGaleria.titulo}"></div>
                </div>
              </a>
              <div class="overlay-user-wrapper">
                <a class="d-flex gap-1 user-btn" th:href="@{'/usuario/' + ${itemGaleria.nicknameCreador}}">
                  <img th:src="${itemGaleria.avatarCreador}" class="user-avatar" />
                  <span class="user-name" th:text="${'@' + itemGaleria.nicknameCreador}"></span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </section><!-- /Courses Section -->
  <script th:src="@{/assets/js/comentarios.js}"></script>
  <script th:src="@{/assets/js/likesDetalle.js}"></script>
  <script th:src="@{/assets/js/guardadosDetalle.js}"></script>
  <script type="module" src="/assets/js/modelos.js" defer></script>
  <script>
    document.querySelectorAll(".btn-descargar").forEach(boton => {
      boton.addEventListener("click", function () {
        const contador = document.getElementById("contador-descargas");
        let actual = parseInt(contador.innerText);
        contador.innerText = actual + 1;
      });
    });
  </script>
</div>
<!-- Fin ventanas que rellena java-->
</body>

</html>
