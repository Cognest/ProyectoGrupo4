spring.application.name=BuenasPracticasSpringBoot
spring.main.banner-mode=OFF

## Log Levels
logging.level.*=INFO
logging.level.org.*=INFO
#logging.level.com.*=INFO
#logging.level.org.springframework.*=OFF
logging.level.org.hibernate.sql=WARN
logging.level.com.zaxxer.hikari.*=WARN
logging.level.com.example.*=INFO
logging.level.org.hibernate.*=ERROR
logging.level.tc.testcontainers=WARN
logging.level.org.testcontainers.*=OFF
logging.level.com.github.dockerjava=OFF
logging.level.org.apache.*=ERROR
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.jdbc.core.JdbcTemplate=WARN
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO

#Sprint JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.level.org.springframework.web=INFO

## Spring i18n
spring.messages.basename=i18n.messages
spring.messages.fallback-to-system-locale=false

## Archivos
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB



## PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

## Spring Security
spring.security.user.name=user
spring.security.user.password=password



# Si usas Spring Boot 3.x:
management.health.db.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
